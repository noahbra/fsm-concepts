name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (base path = /<repo-name>/)
        env:
          # Project Pages site lives at https://<owner>.github.io/<repo>/. After a custom-domain migration set BASE_PATH to "/".
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_REVIEW_MODE: ${{ vars.VITE_REVIEW_MODE || 'true' }}
          VITE_FEEDBACK: ${{ vars.VITE_FEEDBACK || 'on' }}
          # Production repo variables: SITE=fsm (Concept 06 at the root, nothing else), SITE_ORIGIN=https://<domain>/,
          # VITE_INDEXABLE=true once the domain is live. Unset on the review repo.
          SITE: ${{ vars.SITE || 'review' }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || '' }}
          VITE_INDEXABLE: ${{ vars.VITE_INDEXABLE || 'false' }}
          # Search Console HTML-tag token (production repo variable; empty = no tag).
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION || '' }}
          # Google Tag Manager container (production). Unset = the default in vite.config.ts; set to an empty string to disable.
          GTM_CONTAINER_ID: ${{ vars.GTM_CONTAINER_ID }}
        run: npm run build
      # Production only: snapshot each page's rendered HTML into dist so crawlers that do not run JavaScript
      # (most AI search crawlers) read the content, and write llms.txt from the rendered pages (scripts/prerender.mjs).
      - name: Prerender (production site only)
        if: ${{ vars.SITE == 'fsm' }}
        run: npx playwright install --with-deps chromium && node scripts/prerender.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
